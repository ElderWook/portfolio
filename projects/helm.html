  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a.part') : null;
    if (!a || !a.getAttribute('href') || a.dataset.sealing) return;
    if (rm || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;

  });
